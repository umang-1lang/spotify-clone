<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* the specificity of this is 1 */
        h1{
            color: aqua;
        }
         /* the specificity of this is 10 */
        .yellow{
            color: yellow;
        }
         /* the specificity of this is 10 */
       .cred{
        color: red;
       }
       .cpurple{
        color: purple;
       }
        /* the specificity of this is 10-attribute selector */
       [data-x=a]{
        background-color: blue;
       }
       /* specificity=1+10; */
       h1.yellow{
        color: yellow;
       }

       

    </style>
</head>
<body>
    <div>
        <h1  class="yellow cred cpurple" data-x="a">
            css specificity
        </h1>
    </div>
    
</body>
</html>
