<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box1 {
            background-color: yellow;
            /* position:absolute; */
            position: sticky;
            top: 0px;
            left: 0px;
        }

        /* tranform,perspective and filter-also make box positioned */
        .box2 {
            background-color: green;
            /* position:relative; */
            top: 34px;
            left: 36px;

        }

        .box3 {
            background-color: maroon;
            /* position: fixed; */
            bottom: 0px;
            left: 5px;

        }

        .box4 {
            background-color: purple;
        }

        .box {
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid blue;

        }

        .parent {
            padding: 45px;
            width: 600px;
            margin: 36px;
            border: 2px solid purple;
            /* position:absolute; */

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class=" box box1">

        </div>
        <div class=" box box2">

        </div>
        <div class=" box box3">

        </div>
        <div class=" box box4">

        </div>
    </div>


</body>

</html>
