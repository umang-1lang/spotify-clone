<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>CSS FLEXBOX</title>
    <style>
        .container{
            border: 2px solid red;
            height: 80vh;
            display: flex;
            /* justify-content: center;  */
            align-items: center; 
            flex-direction: row;
            /* flex-wrap: wrap; */
            align-content: center;
            /* there is no justify-items */
            gap: 10px 30px;
            /* row-gap: ; */
            /* column-gap: ; */



        }
        .item{
            flex-grow: 1;
            height: 120px;
            width: 120px;
            border: 2px solid black;
            /* margin: 4px; */
            background-color: blueviolet;
            
        }
        .order-1{
            order: 1;

        }
        .order-2{
            order: 2;
        }
        .item1{
            flex-grow: 3;
        }



  </style>
</head>
<body>
    <main>
        <div class="container">
            <div class=" item item1">1</div>
            <div class="item">2</div>
            <div class="item order-1">3</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item order-2"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            </div>
    </main>
    
</body>
</html>
