 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
    <style>

        .box{
            background-color: yellow; 
        }
        .box2{
            color:green;
            
            padding: 10px;
            margin: 25px;
            border: 2px solid blue;
            height: 200px;
            box-sizing: border-box;

        }
        .box1{
            color: red;
            padding: 10px; 
             margin: 25px; 
             border: 2px solid blue; 
            height: 200px;
            box-sizing: border-box;
            /* content+border+padding */
        }

    </style>
    
 </head>
 <body>
    <div class="box box1">i am umang</div>
    <div class="box box2">i am utsav</div>
    
 </body>
 </html>
