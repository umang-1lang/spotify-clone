<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS variables</title>
    <style>
        :root{
             --color:rgb(255,0,247); 
            --selector:rgb(174,174,222);
            --defpad:23px;
            --defop:0.5;
        }
        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color:var(--color);
        }
        .container{
            background-color: var(--selector);
            color: var(--color);
        }
        ul{
             display: flex; 
             
        }
        ul li{
            /* opacity: 0.3; */
            opacity: var(--defop);
            list-style: none;
            /* padding: 30px; */
            padding: var(--defpad); 
            border: 2px solid black ;
        }
        ul li:first-child{
             --color:rgb(0, 255, 162); 
            background-color:var(--color,maroon);
        }


    </style>

</head>
<body>
    <div class="nav">
        <ul>
            <li>
                about
            </li>
            <li>home</li>
            <li>contacts</li>
        </ul>
    </div>
    <div class="container">

    </div>
    
</body>
</html>
