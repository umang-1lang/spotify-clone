<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
         .img1{
            filter: blur(10px);
            width: 200px;
            /* filter: invert(0); */
            filter: opacity(0.9);
        } 
         .img2{
            filter: brightness(122%) contrast(95%);
         }
         .img3{
            filter: sepia(100%);
            width: 150px;
         }




    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXCsW10nAjoXFTDiXZW7Y-fPj9YPUX0aDKyIj-R9lhYw&s=10">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3J5RZ027ER78QW2hb_X_cIqa7i2c7SpFNLmf17qAmpw&s=10">
        <img class="img3" src="https://i.pinimg.com/736x/27/59/2a/27592a992de78e5c39c678a78c34cce3.jpg">
    </div>
    
</body>
</html>
