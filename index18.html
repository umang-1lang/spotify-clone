<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid blue;
            padding: 34px;
            /* margin: 30px; */
            box-shadow: 5px 15px 5px green;

        }

        .text-element {
            text-shadow: 2px 2px 4px red;
            border: 2px solid blue;
            outline: 2px solid green;
            outline-offset: 13px;
        }
    </style>
</head>

<body>
    <div class="box">
        i am a box
    </div>
    <p class="text-element">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Natus culpa aliquid, id blanditiis molestiae at
        delectus expedita repellat ad ullam, commodi aut! Earum.
    </p>

</body>

</html>
