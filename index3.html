<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms-Lets learn it</title>
</head>

<body>
    <h1>FORM TO APPLY FOR TA SIGMA WEB DEVLOMENT COURSE</h1>
    <form action="post">
        <div><label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div><input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="comment">enter your comment</label>
            <textarea name="comment" rows="4" cols="50">

</textarea>
        </div>
        <div><select name="fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="cherry">Cherry</option>
            </select></div>


    </form>

</body>

</html>
