<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV BAR</title>
    <style>
        body{
            background-color: lightcyan;
            height: 9500px;
        }

        .container{
            border: 1px solid black;
            border-radius: 5px;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 50px;
            padding-left: 10px;
            background-color: yellow;
            position: sticky;
            top: 0px;
        }
        .item-7{
            padding-right: 300px;
        }
        
        
        .nav-left-end{
            
            display: flex;
            align-items: center;
            gap: 50px; 
            font-size: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
        .nav-middle{
            
            display: flex;
            align-items: center;
            gap:40px;
            margin-left: 300px;
            font-size: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
        .img{
            width: 90px;
        }
        

        

    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1"><img class="img" src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_primary_logo.png"></div>
        <div class="nav-middle">
     <div class="item item-2">Product</div>
     <div class="item item-3">Buy</div>
     <div class="item item-4">Renew</div>
     <div class="item item-5">Support</div>
     <div class="item item-6">Learn</div>
     <div class="item item-7">Company</div>
    </div>
     <div class="nav-left-end">
     <div class="item item-8">Download</div>
     <div class="item item-9">English</div>
    </div>
</div>
    
</body>
</html>
