<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float and clear</title>
    <style>
        .cards{
            border: 2px solid black;
            display: flow-root;  

        }
        .card{
            border: 2px solid red;
        }
        img{
            float: left;
        }
        .card:nth-child(3){
            background-color: aqua;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="cards">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSn6ILkPRsBKR_pLfDAL99S-jrRTnnBVX2ak0MAwQr1JXv8mnOI0J2rK5A&s=10" width="230">
    <div class="card">Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt, eaque aspernatur cupiditate distinctio ratione, labore dolorum accusantium iste, asperiores quo repellat sapiente pariatur.</div>
    <div class="card">card 2</div>
    <div class="card">card 3</div>
    </div>
    
</body>
</html>
