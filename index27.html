<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGNING OF A LAYOUT</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
       
        .screen {
            background-color: black;
            border: 250px;
            height: 9500px;
            margin: 0;
            padding: 0;

        }

        .navbar {
            background-color: maroon;
            border: 10px;
            height: 45px;
            position: sticky;
            top: 0px;
        }

        .bg {
            background-color: green;
            height: 200px;
            margin: 7px;
            padding-top:10px;
            padding-left: 30px; 
            padding-bottom: 10px;
            padding-right: 30px; 
            
            display: flex;
            justify-content: center;
            
            

        }
        .box1{
            background-color: blanchedalmond;
            height: 20vh;
            width: 50%;
            margin: 10px;
            flex-shrink: 0;
            /* padding:; */
        }
        .box2{
            background-color: rgb(205, 221, 255);
            height: 20vh;
            width: 50%;
            margin: 10px;
            flex-shrink: 0;

        }
        .radius{
            background-color: black;
            border: 2px solid white;
            border-radius: 35px;
            height: 80px;
            width: 350px;
            margin-left: 500px;
            margin-top: 5px;
            color: white;
            text-align: center;
            font-size: 30px;
            padding: 15px;
           
           

        }
        .footer{
            background-color: rgb(202, 180, 180);
            border: 2px solid rgba(167, 139, 159, 0.755);
            height: 35px;
            margin-top: 520px;
            
        }
        .img{
            width: 50px;
            position: fixed;
            right: 0px;
            bottom: 0px;

        }
        


    </style>
</head>

<body>
    <div class="screen">
        <div class="navbar"></div>
        <div class="bg">
            <div class="box1"></div>
            <div class="box2"></div></div>
            <div class="radius">Welcome to this sigma web devlopment express</div>
            <img class="img" src="https://res.cloudinary.com/vistaprint/images/f_auto,q_auto/v1706191816/ideas-and-advice-prod/blogadmin/Screenshot-2024-01-25-at-15.09.28/Screenshot-2024-01-25-at-15.09.28.png?_i=AA" >
        <div class="footer"></div>
    </div>


</body>

</html>
